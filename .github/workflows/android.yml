name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Debug builds are signed with the auto-generated debug keystore, which
      # differs per runner. Installing a new PR build over an older one therefore
      # needs an uninstall first; that is called out in the PR comment below.
      - name: Name the APK after the build
        id: apk
        run: |
          set -euo pipefail
          src=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          name="bilingual-keyboard-${GITHUB_SHA::7}.apk"
          mkdir -p artifacts
          cp "$src" "artifacts/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment download link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- apk-build-comment -->';
            const body = [
              marker,
              '### 📦 Debug APK',
              '',
              `**[${process.env.APK_NAME}](${process.env.ARTIFACT_URL})** — built from \`${context.sha.slice(0, 7)}\`.`,
              '',
              'GitHub serves artifacts as a zip; unzip it to get the APK.',
              'Debug builds from different runs are signed with different debug keys,',
              'so uninstall the previous build before installing a new one.',
              '',
              '```',
              `adb install -r ${process.env.APK_NAME}`,
              '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
